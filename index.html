<!DOCTYPE html>

<head>

    styles.css
</head>

        </div>

        <h2>How It Works</h2>
        <div class="steps">
            <div class="step">
                <img src="images/icon1.png"
                <p>Record/Answer Prompts</p>
            </div>
            <div class="step">
                <img src="images/icon2.png"
                <p>AI Personality Scan</p>
            </div>
            <div class="step">

            </div>
